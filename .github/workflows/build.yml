name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar (se enviou o zip)
        run: |
          if [ -f FileManagerTV.zip ]; then unzip -q -o FileManagerTV.zip; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk file-manager-tv.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: File Manager TV ${{ github.run_number }}
          files: file-manager-tv.apk
          make_latest: true
